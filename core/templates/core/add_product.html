{% extends 'base.html' %}
{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<style>
  body {
    background-color: #e0f2f1;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px 0;
  }
  .container-form {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
  }
  h2 {
    color: #00796b;
    font-weight: 700;
    text-align: center;
    margin-bottom: 25px;
  }
  label {
    font-weight: 600;
    color: #004d40;
  }
  .teal-btn {
    background-color: #00796b;
    color: white;
    border: none;
  }
  .teal-btn:hover {
    background-color: #004d40;
    color: white;
  }
</style>

<div class="container-form">
  <h2>Add New Product</h2>
  <form method="POST" enctype="multipart/form-data" novalidate>
    {% csrf_token %}

    <div class="mb-3">
      <label for="id_name" class="form-label">Product Name</label>
      <input type="text" id="id_name" name="name" class="form-control" placeholder="Enter product name" required>
    </div>

    <div class="mb-3">
      <label for="id_category" class="form-label">Category</label>
      <select id="id_category" name="category" class="form-select" required>
        <option value="" disabled selected>Select category</option>
        {% for cat in categories %}
          <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="id_brand" class="form-label">Brand</label>
      <input type="text" id="id_brand" name="brand" class="form-control" placeholder="Brand name" required>
    </div>

    <!-- ✅ New Price Fields -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="id_mrp_price" class="form-label">MRP (₹)</label>
        <input type="number" step="0.01" min="0" id="id_mrp_price" name="mrp_price" class="form-control" placeholder="Enter MRP" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="id_selling_price" class="form-label">Selling Price (₹)</label>
        <input type="number" step="0.01" min="0" id="id_selling_price" name="selling_price" class="form-control" placeholder="Enter Selling Price" required>
      </div>
      <div class="col-md-12 mb-3">
        <label class="form-label">Discount</label>
        <input type="text" id="discountPreview" class="form-control" disabled value="No Offer">
      </div>
    </div>

    <div class="mb-3">
      <label for="id_stock" class="form-label">Stock Quantity</label>
      <input type="number" min="0" id="id_stock" name="stock" class="form-control" placeholder="Available stock" required>
    </div>

    <div class="mb-3">
      <label for="id_description" class="form-label">Description</label>
      <textarea id="id_description" name="description" rows="5" class="form-control" placeholder="Enter product description" required></textarea>
    </div>

    <div class="mb-3">
      <label for="id_more_images" class="form-label">Product Images</label>
      <input type="file" id="id_more_images" name="more_images" class="form-control" multiple accept="image/*" required>
      <div class="form-text">You can select multiple images.</div>
    </div>

    <button type="submit" class="btn teal-btn w-100 btn-lg">Add Product</button>
  </form>
</div>

<!-- ✅ Auto Discount Preview Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const mrpInput = document.getElementById("id_mrp_price");
  const sellingInput = document.getElementById("id_selling_price");
  const discountBox = document.getElementById("discountPreview");

  function calculateDiscount() {
    const mrp = parseFloat(mrpInput.value);
    const selling = parseFloat(sellingInput.value);

    if (mrp && selling && selling < mrp) {
      const discount = Math.round(((mrp - selling) / mrp) * 100);
      discountBox.value = discount + "% OFF";
    } else {
      discountBox.value = "No Offer";
    }
  }

  mrpInput.addEventListener("input", calculateDiscount);
  sellingInput.addEventListener("input", calculateDiscount);
</script>
{% endblock %}
