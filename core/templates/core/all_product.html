<!-- kartloop/core/templates/core/all_products.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Products - Kartloop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
        }

        .card-content h3 {
            margin: 0 0 10px;
            font-size: 1.1rem;
            color: #222;
        }

        .card-content p {
            margin: 0 0 8px;
            font-size: 0.9rem;
            color: #555;
        }

        .price {
            font-weight: bold;
            color: #008000;
        }

        .add-btn {
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .add-btn:hover {
            background-color: #0056b3;
        }

        .empty-message {
            text-align: center;
            color: #777;
            margin-top: 50px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>All Products</h1>

    {% if products %}
        <div class="grid">
            {% for product in products %}
                <div class="card">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                    <div class="card-content">
                        <h3>{{ product.name }}</h3>
                        <p>{{ product.description|truncatewords:15 }}</p>
                        <p class="price">₹{{ product.price }}</p>
                        <a href="{% url 'add_to_cart' product.id %}" class="add-btn">Add to Cart</a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="empty-message">No products available right now. Please check back later.</p>
    {% endif %}
</div>
</body>
</html>
