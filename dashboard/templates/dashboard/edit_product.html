{% extends 'base.html' %}
{% block content %}
<h2>Edit Product: {{ product.name }}</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save Changes</button>
  <a href="{% url 'dashboard:manage_products' %}">Cancel</a>
</form>

{% endblock %}
